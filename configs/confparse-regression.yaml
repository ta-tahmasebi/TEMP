version: 1

target:
  name: confparse-regression
  description: "Overflow fixed, but the accepted value length is tightened below the specification."
  language: c

source:
  mode: directories
  base_path: ../targets/confparse/base
  patched_path: ../targets/confparse/regression

build:
  working_dir: "."
  binary: build/confparse
  commands:
    - ["make", "clean"]
    - ["make"]
  env:
    CC: gcc
  timeout_s: 300

execution:
  argv: ["{binary}"]
  delivery: stdin
  timeout_s: 10
  limits:
    memory_mb: 1024
    cpu_s: 10

tests:
  manifest: ../targets/confparse/tests/manifest.yaml

sandbox:
  enabled: true

analysis:
  replay_count: 3
  minimize: true
  generate_regression_tests: true

artifacts:
  root: ../.dynan
