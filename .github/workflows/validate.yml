name: validate

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap gcc binutils make
      - run: pip install -e '.[dev]'
      - run: pytest -q
      - run: dynan validate --config configs/confparse-correct.yaml --json-out result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-report
          path: |
            result.json
            .dynan/runs/
